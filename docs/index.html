<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Re:Earth CLI</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --code: #f5f5f4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c0a09; --fg: #fafaf9; --muted: #a8a29e; --code: #1c1917; } }
  body { font: 16px/1.6 system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; }
  main { max-width: 40rem; margin: 0 auto; padding: 4rem 16px; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { color: var(--muted); }
  pre { background: var(--code); padding: 1rem; border-radius: 8px; overflow-x: auto; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Re:Earth CLI</h1>
  <p>The command-line interface for Re:Earth.</p>
  <pre><code>brew install reearth/tap/reearth
winget install Reearth.Reearth
curl -fsSL https://cli.reearth.io/install.sh | sh</code></pre>
  <p><a href="https://github.com/reearth/cli">github.com/reearth/cli</a></p>
</main>
</body>
</html>
